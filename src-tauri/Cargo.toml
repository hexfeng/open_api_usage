[package]
name = "ai-usage-dashboard"
version = "0.1.0"
description = "Local-first AI account usage and balance monitor"
authors = ["AI Usage Dashboard contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_usage_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
